name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android v4 (v3 fallaba: Google eliminó el paquete "tools").
      # Se instala explícitamente la plataforma que pide el proyecto (compileSdk = 37)
      # y las build-tools, para no depender de la descarga automática de Gradle.
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace
